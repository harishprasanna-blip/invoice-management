spring:
  application:
    name: exception-handling-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_management_prod}
    username: ${DB_USERNAME:invoice_app}
    password: ${DB_PASSWORD:invoice_secure_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: ${PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ML Resolution Service Configuration
ml:
  resolution:
    base-url: ${PYTHON_ML_BASE_URL:http://localhost:8002}
    timeout-seconds: 30

# Logging
logging:
  level:
    com.invoicemanagement.exceptionhandling: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
